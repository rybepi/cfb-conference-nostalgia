name: Update standings and deploy

on:
  schedule:
    # 11:00 UTC = 6:00 a.m. EST (Nov-Mar). Runs at 7:00 a.m. EDT before Nov 1 / after Mar.
    - cron: "0 11 * * 0"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pull results from ESPN
        run: node scripts/update.mjs
      - name: Commit data if changed
        run: |
          git config user.name "cfb-bot"
          git config user.email "cfb-bot@users.noreply.github.com"
          git add data/games.json data/unmatched.json
          git diff --staged --quiet || (git commit -m "Update results" && git push)
        continue-on-error: true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
